<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Placar · Erro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#18181b}
a{color:#e4e4e7}a:hover{color:#ffffff}
.b-solid:hover{background:#e4e4e7 !important}
.b-subtle:hover{background:#3f3f46 !important}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background-color: #18181b; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 24px 24px; color: #e4e4e7; font-family: 'Open Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="height: 72px; box-sizing: border-box; padding: 0 clamp(16px, 5vw, 64px); display: flex; align-items: center">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; color: #ffffff; text-decoration: none">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #ffffff; display: flex; align-items: center; justify-content: center; gap: 3px">
<span style="width: 4px; height: 14px; border-radius: 2px; background: #18181b"></span>
<span style="width: 4px; height: 14px; border-radius: 2px; background: #18181b; opacity: 0.45"></span>
</span>
<span style="font-size: 22px; font-weight: 700">Placar</span>
</a>
</header>
<main style="flex: 1 1 auto; box-sizing: border-box; padding: 32px 16px 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px">
<div role="img" aria-label="Erro {{code}}" style="display: flex; gap: clamp(8px, 1.5vw, 14px); margin-bottom: 28px">
<sc-for list="{{digits}}" as="d" hint-placeholder-count="3">
<span aria-hidden="true" style="position: relative; width: clamp(76px, 12vw, 128px); height: clamp(104px, 16vw, 168px); border-radius: clamp(12px, 1.6vw, 18px); background: #1d1d20; box-shadow: inset 0 0 0 1px #27272a, 0 20px 50px rgba(0,0,0,0.4); overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: clamp(80px, 13vw, 140px); line-height: 1; font-weight: 700; color: #ffffff">
{{d}}
<span style="position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #18181b"></span>
</span>
</sc-for>
</div>
<h1 style="margin: 0; font-size: clamp(24px, 3vw, 32px); line-height: 1.25; font-weight: 700; color: #ffffff">{{title}}</h1>
<p style="margin: 0; max-width: 420px; font-size: 16px; line-height: 24px; color: #9f9fa9">{{text}}</p>
<div style="margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px">
<a class="b-solid" href="Main.dc.html" style="height: 48px; box-sizing: border-box; padding: 0 20px; border-radius: 10px; background: #ffffff; color: #18181b; font-size: 15px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m11 18-6-6 6-6"></path></svg>
Voltar para o início
</a>
<sc-if value="{{logado}}" hint-placeholder-val="{{ true }}">
<a class="b-subtle" href="Painel.dc.html" style="height: 48px; box-sizing: border-box; padding: 0 20px; border-radius: 10px; background: #27272a; box-shadow: inset 0 0 0 1px #3f3f46; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center">Ir para o painel</a>
</sc-if>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;caso&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;404 · placar&quot;,&quot;404 · página&quot;,&quot;400 · ID inválido&quot;,&quot;500 · servidor&quot;],&quot;default&quot;:&quot;404 · placar&quot;},&quot;logado&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const caso = this.props.caso ?? '404 · placar';
    const msgs = {
      '404 · placar': ['404', 'Placar não encontrado', 'Esse placar não existe ou foi apagado. Confira o ID com quem compartilhou.'],
      '404 · página': ['404', 'Página não encontrada', 'Esse endereço não existe. Confira o link ou volte para o início.'],
      '400 · ID inválido': ['400', 'ID inválido', 'O ID do placar tem 6 caracteres, só letras minúsculas e números.'],
      '500 · servidor': ['500', 'Erro interno do servidor', 'Algo deu errado do nosso lado. Tente de novo em alguns instantes.']
    };
    const m = msgs[caso] || ['500', 'Erro desconhecido', 'Tente de novo em alguns instantes.'];
    return { code: m[0], digits: m[0].split(''), title: m[1], text: m[2], logado: this.props.logado ?? true };
  }
}
</script>
</body>
</html>
