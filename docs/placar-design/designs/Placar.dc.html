<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Placar · Time Azul x Time Laranja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#18181b}
a{color:#e4e4e7}a:hover{color:#ffffff}
.b-solid:hover{background:#e4e4e7 !important}
.b-solid:active{transform:scale(.98)}
.b-subtle:hover{background:#3f3f46 !important}
.b-subtle:disabled{opacity:.4;cursor:not-allowed}
.b-ghost:hover{background:#27272a !important;color:#ffffff !important}
.b-ghost:disabled{opacity:.4;cursor:not-allowed}
.pl-panel{transition:box-shadow .2s ease}
:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
@media (max-width:720px){.hide-sm{display:none !important}}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; background: #18181b; color: #e4e4e7; font-family: 'Open Sans', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="border-bottom: 1px solid #27272a">
<div style="max-width: 1440px; height: 72px; box-sizing: border-box; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px">
<div style="display: flex; justify-content: flex-start">
<a class="b-ghost" href="Painel.dc.html" style="height: 44px; box-sizing: border-box; padding: 0 14px 0 8px; border-radius: 8px; color: #d4d4d8; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
Painel
</a>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 7px; background: #ffffff; display: flex; align-items: center; justify-content: center; gap: 3px">
<span style="width: 3px; height: 12px; border-radius: 2px; background: #18181b"></span>
<span style="width: 3px; height: 12px; border-radius: 2px; background: #18181b; opacity: 0.45"></span>
</span>
<span style="font-size: 20px; font-weight: 700; color: #ffffff">Placar</span>
</div>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px">
<span class="hide-sm" style="height: 32px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; background: rgba(5,223,114,0.08); box-shadow: inset 0 0 0 1px rgba(5,223,114,0.25); font-size: 13px; font-weight: 600; color: #05df72; display: inline-flex; align-items: center; gap: 8px">
<span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #05df72; box-shadow: 0 0 0 3px rgba(5,223,114,0.2)"></span>
Ao vivo
</span>
<button class="b-subtle" type="button" onClick="{{copyLink}}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 8px; background: #27272a; box-shadow: inset 0 0 0 1px #3f3f46; color: #e4e4e7; font-family: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="m16 6-4-4-4 4"></path><path d="M12 2v13"></path></svg>
<span class="hide-sm">Compartilhar</span>
</button>
<a class="b-subtle" href="Configuracoes.dc.html" aria-label="Configurações" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 8px; background: #27272a; box-shadow: inset 0 0 0 1px #3f3f46; color: #e4e4e7; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</a>
</div>
</div>
</header>

<div style="max-width: 1440px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 28px clamp(16px, 4vw, 48px) 48px; display: flex; flex-direction: column; gap: 24px; flex: 1 1 auto">

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px">
<button class="b-ghost" type="button" onClick="{{copyId}}" aria-label="Copiar ID do placar" style="height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; box-shadow: inset 0 0 0 1px #27272a; color: #e4e4e7; font-family: ui-monospace, monospace; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer">
<span><span style="color: #71717b">#</span>k3x9a2</span>
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: 0.6"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
</button>
<span style="height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px #27272a; font-size: 13px; color: #9f9fa9; display: inline-flex; align-items: center; gap: 6px"><strong style="color: #ffffff; font-weight: 700">+{{inc}}</strong> por clique</span>
<span class="hide-sm" style="height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px #27272a; font-size: 13px; color: #9f9fa9; display: inline-flex; align-items: center">Criado há 2 h</span>
</div>

<main style="display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; gap: 20px">
<section class="pl-panel" aria-label="Time Azul" style="flex: 1 1 380px; min-width: 0; overflow: hidden; border-radius: 20px; background: #1d1d20; box-shadow: {{ringA}}; display: flex; flex-direction: column">
<div aria-hidden="true" style="height: 6px; background: {{corA}}"></div>
<div style="padding: clamp(20px, 3vw, 32px); display: flex; flex-direction: column; gap: 16px; flex: 1 1 auto">
<div style="display: flex; align-items: center; gap: 14px; min-width: 0">
<span aria-hidden="true" style="flex: 0 0 auto; width: 48px; height: 48px; border-radius: 12px; background: {{tintA}}; color: {{corA}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">TA</span>
<h2 style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: clamp(20px, 2.2vw, 30px); line-height: 1.2; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Time Azul</h2>
<sc-if value="{{leadA}}" hint-placeholder-val="{{ true }}">
<span style="flex: 0 0 auto; height: 28px; box-sizing: border-box; padding: 0 10px; border-radius: 999px; background: #ffffff; color: #18181b; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center">Na frente</span>
</sc-if>
</div>
<output aria-live="polite" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: {{scoreSize}}; line-height: 0.9; font-weight: 700; color: #ffffff; font-variant-numeric: tabular-nums; letter-spacing: -2px">{{a}}</output>
<div style="display: flex; gap: 10px">
<button class="b-subtle" type="button" onClick="{{minusA}}" disabled="{{noMinusA}}" aria-label="Tirar {{inc}} do Time Azul" style="flex: 0 0 auto; width: 64px; height: 64px; border: 0; border-radius: 12px; background: #27272a; box-shadow: inset 0 0 0 1px #3f3f46; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<button class="b-solid" type="button" onClick="{{plusA}}" aria-label="Somar {{inc}} para Time Azul" style="flex: 1 1 auto; height: 64px; border: 0; border-radius: 12px; background: #ffffff; color: #18181b; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">+{{inc}}</button>
</div>
</div>
</section>

<div aria-hidden="true" style="flex: 0 0 auto; align-self: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0">
<span style="width: 56px; height: 56px; border-radius: 50%; background: #18181b; box-shadow: inset 0 0 0 1px #3f3f46; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: #9f9fa9; display: flex; align-items: center; justify-content: center">VS</span>
<span style="font-size: 12px; font-weight: 600; color: #71717b; text-align: center; white-space: pre-line">{{diffText}}</span>
</div>

<section class="pl-panel" aria-label="Time Laranja" style="flex: 1 1 380px; min-width: 0; overflow: hidden; border-radius: 20px; background: #1d1d20; box-shadow: {{ringB}}; display: flex; flex-direction: column">
<div aria-hidden="true" style="height: 6px; background: {{corB}}"></div>
<div style="padding: clamp(20px, 3vw, 32px); display: flex; flex-direction: column; gap: 16px; flex: 1 1 auto">
<div style="display: flex; align-items: center; gap: 14px; min-width: 0">
<span aria-hidden="true" style="flex: 0 0 auto; width: 48px; height: 48px; border-radius: 12px; background: {{tintB}}; color: {{corB}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">TL</span>
<h2 style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: clamp(20px, 2.2vw, 30px); line-height: 1.2; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Time Laranja</h2>
<sc-if value="{{leadB}}" hint-placeholder-val="{{ false }}">
<span style="flex: 0 0 auto; height: 28px; box-sizing: border-box; padding: 0 10px; border-radius: 999px; background: #ffffff; color: #18181b; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center">Na frente</span>
</sc-if>
</div>
<output aria-live="polite" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: {{scoreSize}}; line-height: 0.9; font-weight: 700; color: #ffffff; font-variant-numeric: tabular-nums; letter-spacing: -2px">{{b}}</output>
<div style="display: flex; gap: 10px">
<button class="b-subtle" type="button" onClick="{{minusB}}" disabled="{{noMinusB}}" aria-label="Tirar {{inc}} do Time Laranja" style="flex: 0 0 auto; width: 64px; height: 64px; border: 0; border-radius: 12px; background: #27272a; box-shadow: inset 0 0 0 1px #3f3f46; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<button class="b-solid" type="button" onClick="{{plusB}}" aria-label="Somar {{inc}} para Time Laranja" style="flex: 1 1 auto; height: 64px; border: 0; border-radius: 12px; background: #ffffff; color: #18181b; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">+{{inc}}</button>
</div>
</div>
</section>
</main>

<section aria-labelledby="jogadas" style="border-radius: 16px; background: #1d1d20; box-shadow: inset 0 0 0 1px #27272a; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 id="jogadas" style="margin: 0; font-size: 14px; font-weight: 600; color: #ffffff">Últimas jogadas</h2>
<button class="b-ghost" type="button" onClick="{{undo}}" disabled="{{noUndo}}" style="height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg>
Desfazer
</button>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{log}}" as="e" hint-placeholder-count="3">
<li style="height: 36px; box-sizing: border-box; padding: 0 12px 0 10px; border-radius: 8px; background: #18181b; box-shadow: inset 0 0 0 1px #27272a; display: flex; align-items: center; gap: 8px; font-size: 13px; opacity: {{e.op}}">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{e.cor}}"></span>
<span style="font-weight: 600; color: #ffffff">{{e.time}}</span>
<span style="font-weight: 700; color: {{e.deltaCor}}">{{e.delta}}</span>
<span style="color: #9f9fa9">→ {{e.after}} · {{e.when}}</span>
</li>
</sc-for>
</ol>
<sc-if value="{{noUndo}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 13px; color: #9f9fa9">Nenhuma jogada ainda.</p>
</sc-if>
</section>
</div>

<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: fixed; right: 24px; bottom: 24px; max-width: calc(100% - 48px); box-sizing: border-box; padding: 14px 16px; border-radius: 12px; background: #1d1d20; box-shadow: 0 0 0 1px #3f3f46, 0 16px 40px rgba(0,0,0,0.55); display: flex; align-items: center; gap: 12px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#05df72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
<div style="display: flex; flex-direction: column">
<span style="font-size: 14px; font-weight: 600; color: #ffffff">{{toastTitle}}</span>
<span style="font-size: 13px; color: #9f9fa9">{{toastText}}</span>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tamanho":{"editor":"enum","options":["Pequeno","Médio","Grande"],"default":"Grande"},"incremento":{"editor":"int","min":1,"max":10,"default":1},"corA":{"editor":"color","default":"#51a2ff","options":["#51a2ff","#05df72","#a684ff","#fb64b6"]},"corB":{"editor":"color","default":"#ff8904","options":["#ff8904","#fdc700","#ff6467","#05df72"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      a: 12, b: 9, toast: null,
      log: [
        { t: 'A', d: 1, after: 12, when: 'há 1 min' },
        { t: 'B', d: 1, after: 9, when: 'há 2 min' },
        { t: 'A', d: 1, after: 11, when: 'há 3 min' },
        { t: 'A', d: -1, after: 10, when: 'há 4 min' }
      ]
    };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  showToast(kind) {
    clearTimeout(this.t);
    this.setState({ toast: kind });
    this.t = setTimeout(() => this.setState({ toast: null }), 2400);
  }
  score(team, d) {
    const s = this.state;
    const cur = team === 'A' ? s.a : s.b;
    const next = Math.max(0, cur + d);
    if (next === cur) return;
    const ev = { t: team, d: next - cur, after: next, when: 'agora' };
    this.setState(team === 'A' ? { a: next, log: [ev].concat(s.log) } : { b: next, log: [ev].concat(s.log) });
  }
  renderVals() {
    const s = this.state;
    const inc = this.props.incremento ?? 1;
    const corA = this.props.corA ?? '#51a2ff';
    const corB = this.props.corB ?? '#ff8904';
    const sizes = { 'Pequeno': 'clamp(88px, 10vw, 150px)', 'Médio': 'clamp(110px, 14vw, 210px)', 'Grande': 'clamp(130px, 18vw, 280px)' };
    const diff = Math.abs(s.a - s.b);
    const names = { A: 'Time Azul', B: 'Time Laranja' };
    return {
      a: s.a, b: s.b, inc: inc,
      corA: corA, corB: corB, tintA: corA + '24', tintB: corB + '24',
      scoreSize: sizes[this.props.tamanho ?? 'Grande'] || sizes['Grande'],
      leadA: s.a > s.b, leadB: s.b > s.a,
      ringA: s.a > s.b ? 'inset 0 0 0 1px ' + corA + '99' : 'inset 0 0 0 1px #27272a',
      ringB: s.b > s.a ? 'inset 0 0 0 1px ' + corB + '99' : 'inset 0 0 0 1px #27272a',
      diffText: diff === 0 ? 'Empate' : 'Diferença\n' + diff,
      noMinusA: s.a <= 0, noMinusB: s.b <= 0,
      plusA: () => this.score('A', inc),
      plusB: () => this.score('B', inc),
      minusA: () => this.score('A', -inc),
      minusB: () => this.score('B', -inc),
      log: s.log.slice(0, 6).map((e, i) => ({
        time: names[e.t], cor: e.t === 'A' ? corA : corB,
        delta: (e.d > 0 ? '+' : '−') + Math.abs(e.d),
        deltaCor: e.d > 0 ? '#05df72' : '#ff6467',
        after: e.after, when: e.when, op: i === 0 ? 1 : 0.75
      })),
      noUndo: s.log.length === 0,
      undo: () => {
        const e = s.log[0];
        if (!e) return;
        const rest = s.log.slice(1);
        if (e.t === 'A') this.setState({ a: Math.max(0, s.a - e.d), log: rest });
        else this.setState({ b: Math.max(0, s.b - e.d), log: rest });
      },
      copyId: () => this.showToast('id'),
      copyLink: () => this.showToast('link'),
      toast: !!s.toast,
      toastTitle: s.toast === 'link' ? 'Link copiado!' : 'ID copiado!',
      toastText: s.toast === 'link' ? 'Quem abrir o link acompanha ao vivo.' : 'Quem tiver o ID pode ver o placar.'
    };
  }
}
</script>
</body>
</html>
